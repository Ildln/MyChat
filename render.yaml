services:
  - type: web
    name: mychat
    env: python
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m app.migrations.add_user_profile_fields && python -m app.migrations.add_user_auth_reset_fields && python -m app.migrations.add_user_refresh_fields && python -m app.migrations.add_user_two_factor_fields && python -m app.migrations.add_chat_title && python -m app.migrations.create_push_subscription_table
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mychat-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

databases:
  - name: mychat-db
    databaseName: mychat
    user: mychat
